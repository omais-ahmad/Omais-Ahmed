<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="author" content="Omais Ahmed" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <script>
      // Runs before first paint: marks scripting as available and restores the saved theme.
      ;(function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') root.dataset.theme = saved
        } catch (error) {}
      })()
    </script>
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <noscript>
      <p style="padding: 16px; font-family: system-ui, sans-serif">
        This site works best with JavaScript enabled. The page content above is still readable without it.
      </p>
    </noscript>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
